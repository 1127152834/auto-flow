<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AutoFlow Prototype</title>
<style>
:root{--bg:#f1eee7;--surface:#fbfaf7;--surface2:#f6f3ed;--line:#d8d3c9;--text:#302b27;--muted:#817970;--clay:#8d4e2f;--clay-soft:#ead9cf;--sage:#71866b;--sage-soft:#dce6d9;--warn:#b7793e;--danger:#b85c4b;--shadow:0 12px 32px rgba(56,43,31,.08);--r:14px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);background:rgba(251,250,247,.9);display:flex;align-items:center;padding:0 28px;gap:30px;position:sticky;top:0;z-index:3}.brand{font-weight:800;letter-spacing:-.03em;font-size:19px}.brand span{color:var(--clay)}.nav{display:flex;gap:7px}.nav button{border:0;background:transparent;padding:10px 13px;border-radius:9px;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--clay-soft);color:var(--clay)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.icon{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#d4b6a5;color:#6c3925;display:grid;place-items:center;font-size:12px;font-weight:700}.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--line);padding:24px 18px;background:rgba(246,243,237,.62)}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.side-title{font-size:22px;font-weight:750;margin:7px 0 18px}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.list{margin-top:14px;display:grid;gap:5px}.list button{border:0;text-align:left;background:transparent;padding:11px 12px;border-radius:9px;color:var(--text)}.list button.active{background:var(--surface);box-shadow:var(--shadow);color:var(--clay);font-weight:700}.list small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.main{padding:30px 38px 60px;max-width:1440px;width:100%;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.head h1{font-size:30px;letter-spacing:-.04em;margin:4px 0 6px}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650}.btn.primary{background:var(--clay);color:#fff;border-color:var(--clay)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:19px}.metric .label{color:var(--muted);font-size:13px}.metric strong{font-size:29px;display:block;margin-top:9px}.delta{color:var(--sage);font-size:12px;margin-top:7px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.panel h2{font-size:16px;margin:0 0 16px}.wide{grid-column:span 2}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:13px 8px}.table th{font-size:12px;color:var(--muted);font-weight:600}.table tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}.dot.warn{background:var(--warn)}.dot.danger{background:var(--danger)}.tag{border-radius:999px;background:var(--surface2);color:var(--muted);padding:4px 8px;font-size:11px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:span 2}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 11px;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:-4px 0 18px}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent}.tabs button.active{color:var(--clay);border-color:var(--clay);font-weight:700}.modal-backdrop{position:fixed;inset:0;background:rgba(42,31,24,.28);display:none;align-items:center;justify-content:center;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(560px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(42,31,24,.22);padding:23px;animation:rise .15s ease-out}.modal h3{margin:0 0 7px;font-size:19px}.modal p{color:var(--muted);font-size:14px;line-height:1.5}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;right:24px;bottom:24px;background:#302b27;color:#fff;border-radius:10px;padding:13px 16px;box-shadow:var(--shadow);display:none;z-index:6;animation:rise .15s ease-out}.toast.show{display:block}.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--clay);width:68%;border-radius:inherit;transition:width .3s linear}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}.main{padding:24px 18px}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:span 1}.nav{overflow:auto}.top{padding:0 16px;gap:12px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">Auto<span>Flow</span></div><nav class="nav" id="nav"></nav><div class="top-actions"><button class="icon" onclick="showToast('没有新的通知')" aria-label="通知">⌁</button><button class="icon" onclick="openModal('service')" aria-label="服务状态">◉</button><div class="avatar">TC</div></div></header><div class="shell"><aside><div class="eyebrow">Workspace</div><div class="side-title" id="sideTitle">总览</div><input class="search" placeholder="搜索资源" id="search" oninput="filterList()"><div class="list" id="resourceList"></div></aside><main class="main" id="main"></main></div></div>
<div class="modal-backdrop" id="backdrop" onclick="backdropClick(event)"><section class="modal" role="dialog" aria-modal="true" id="modal"></section></div><div class="toast" id="toast"></div>
<script>
const modules={dashboard:{label:'总览',items:['系统概览','最近活动']},profiles:{label:'浏览器配置',items:['全部配置','已启用','草稿']},proxies:{label:'代理管理',items:['代理列表','代理池','导入记录']},kernels:{label:'内核管理',items:['已安装','可用版本']},models:{label:'模型管理',items:['供应商','模型目录']},settings:{label:'设置',items:['本地服务','数据与工作区','偏好设置']}};
let current='dashboard';let selected='';
function init(){document.getElementById('nav').innerHTML=Object.entries(modules).map(([k,v])=>`<button class="${k===current?'active':''}" onclick="go('${k}')">${v.label}</button>`).join('');renderSide();renderMain()}
function go(k){current=k;selected='';init()}
function renderSide(){const m=modules[current];document.getElementById('sideTitle').textContent=m.label;document.getElementById('resourceList').innerHTML=m.items.map((x,i)=>`<button class="${i===0?'active':''}" onclick="selectItem(this,'${x}')">${x}<small>${current==='profiles'?(i?'5 个配置':'12 个配置'):current==='proxies'?(i?'3 个代理池':'28 个代理'):current==='kernels'?(i?'8 个可用版本':'2 个已安装'):'查看详情'}</small></button>`).join('')}
function selectItem(el,x){selected=x;document.querySelectorAll('.list button').forEach(b=>b.classList.remove('active'));el.classList.add('active');showToast(`已切换到${x}`)}
function renderMain(){const m=document.getElementById('main');const title=modules[current].label; if(current==='dashboard')m.innerHTML=dashboard();if(current==='profiles')m.innerHTML=profiles();if(current==='proxies')m.innerHTML=proxies();if(current==='kernels')m.innerHTML=kernels();if(current==='models')m.innerHTML=models();if(current==='settings')m.innerHTML=settings();document.title=`AutoFlow · ${title}`}
function header(title,sub,action){return `<div class="head"><div><div class="eyebrow">${modules[current].label}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${action||''}</div></div>`}
function dashboard(){return header('工作台','今天，系统运行正常。',`<button class="btn" onclick="openModal('service')">服务状态</button>`)+`<div class="grid"><div class="metric"><div class="label">浏览器配置</div><strong>12</strong><div class="delta">↑ 2 个本周新增</div></div><div class="metric"><div class="label">健康代理</div><strong>24 <small style="font-size:14px;color:var(--muted)">/ 28</small></strong><div class="delta">85.7% 可用</div></div><div class="metric"><div class="label">已安装内核</div><strong>2</strong><div class="delta">全部为最新版本</div></div><div class="panel wide"><h2>最近活动</h2><table class="table"><tr><th>事件</th><th>时间</th><th>状态</th></tr><tr><td>代理池「北美主池」健康检查</td><td>刚刚</td><td><span class="status"><i class="dot"></i>完成</span></td></tr><tr><td>浏览器配置「工作账号」已更新</td><td>12 分钟前</td><td><span class="status"><i class="dot"></i>完成</span></td></tr><tr><td>模型供应商连接测试</td><td>昨天</td><td><span class="status"><i class="dot warn"></i>需关注</span></td></tr></table></div><div class="panel"><h2>服务状态</h2><p class="sub">本地 sidecar</p><div style="font-size:24px;font-weight:750;margin:14px 0">运行中</div><span class="status"><i class="dot"></i>127.0.0.1:8765</span></div></div>`}
function profiles(){return header('浏览器配置','管理启动参数、指纹和代理关联。',`<button class="btn" onclick="openModal('import')">导入</button><button class="btn primary" onclick="openModal('profile')">+ 新建配置</button>`)+`<div class="panel"><div class="tabs"><button class="active">全部配置 <span class="tag">12</span></button><button>已启用 <span class="tag">9</span></button><button>草稿 <span class="tag">3</span></button></div><table class="table"><tr><th>配置</th><th>内核</th><th>代理</th><th>状态</th><th></th></tr>${[['工作账号','Chromium 128','北美主池','已启用'],['广告测试','Chromium 127','固定代理 03','已启用'],['调试环境','Chromium 128','无代理','草稿']].map((r,i)=>`<tr><td><b>${r[0]}</b><div class="sub">最后修改 ${i? '昨天':'12 分钟前'}</div></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status"><i class="dot ${r[3]==='草稿'?'warn':''}"></i>${r[3]}</span></td><td><button class="btn ghost" onclick="openModal('profile')">编辑</button><button class="btn ghost danger" onclick="openModal('delete')">删除</button></td></tr>`).join('')}</table></div>`}
function proxies(){return header('代理管理','代理资源、代理池和健康状态。',`<button class="btn" onclick="openModal('import')">批量导入</button><button class="btn primary" onclick="openModal('proxy')">+ 添加代理</button>`)+`<div class="grid"><div class="metric"><div class="label">全部代理</div><strong>28</strong></div><div class="metric"><div class="label">健康</div><strong>24</strong><div class="delta">85.7% 可用</div></div><div class="metric"><div class="label">代理池</div><strong>3</strong></div><div class="panel wide"><h2>代理列表</h2><table class="table"><tr><th>地址</th><th>协议</th><th>标签</th><th>健康状态</th><th></th></tr><tr><td>us-east-01.example</td><td>HTTPS</td><td><span class="tag">北美</span></td><td><span class="status"><i class="dot"></i>正常 · 82ms</span></td><td><button class="btn ghost" onclick="openModal('test')">测试</button></td></tr><tr><td>eu-west-02.example</td><td>SOCKS5</td><td><span class="tag">欧洲</span></td><td><span class="status"><i class="dot warn"></i>超时</span></td><td><button class="btn ghost" onclick="openModal('test')">重试</button></td></tr></table></div><div class="panel"><h2>代理池</h2><p class="sub">按策略选择可用代理</p><button class="btn" style="margin-top:15px" onclick="openModal('pool')">管理代理池</button></div></div>`}
function kernels(){return header('内核管理','安装和维护可用的浏览器内核。',`<button class="btn" onclick="showToast('正在检查新版本…')">检查更新</button>`)+`<div class="grid"><div class="panel wide"><h2>已安装</h2><div style="display:grid;gap:14px"><div style="border-bottom:1px solid var(--line);padding-bottom:14px"><b>Chromium Stable</b><span class="tag" style="margin-left:8px">128.0.6613</span><p class="sub">macOS arm64 · ~/Library/Application Support/AutoFlow/kernels</p><span class="status"><i class="dot"></i>可用</span></div><div><b>Chromium Beta</b><span class="tag" style="margin-left:8px">127.0.6533</span><p class="sub">macOS arm64 · 2.1 GB</p><span class="status"><i class="dot warn"></i>有更新</span></div></div></div><div class="panel"><h2>下载任务</h2><p class="sub">Chromium Stable 128</p><div style="margin:18px 0 8px;display:flex;justify-content:space-between;font-size:12px"><span>下载中</span><b>68%</b></div><div class="progress"><i></i></div><button class="btn" style="margin-top:16px" onclick="showToast('下载已暂停')">暂停下载</button></div></div>`}
function models(){return header('模型管理','供应商、模型目录和连接状态。',`<button class="btn primary" onclick="openModal('provider')">+ 添加供应商</button>`)+`<div class="grid"><div class="panel wide"><h2>供应商</h2><table class="table"><tr><th>供应商</th><th>模型</th><th>状态</th><th></th></tr><tr><td><b>OpenAI</b><div class="sub">https://api.openai.com/v1</div></td><td>6 个模型</td><td><span class="status"><i class="dot"></i>已连接 · 124ms</span></td><td><button class="btn ghost" onclick="openModal('provider')">编辑</button></td></tr><tr><td><b>Anthropic</b><div class="sub">密钥已配置</div></td><td>4 个模型</td><td><span class="status"><i class="dot warn"></i>未测试</span></td><td><button class="btn ghost" onclick="showToast('正在测试连接…')">测试</button></td></tr></table></div><div class="panel"><h2>默认模型</h2><p class="sub">用于后续自动化编排</p><strong style="display:block;margin-top:18px">gpt-4.1-mini</strong><span class="tag" style="display:inline-block;margin-top:9px">OpenAI</span></div></div>`}
function settings(){return header('设置','本地服务、数据目录和偏好设置。',`<button class="btn primary" onclick="showToast('设置已保存')">保存更改</button>`)+`<div class="panel"><div class="tabs"><button class="active">本地服务</button><button>数据与工作区</button><button>偏好设置</button></div><div class="form-grid"><div class="field"><label>服务状态</label><input value="运行中 · 127.0.0.1:8765" disabled></div><div class="field"><label>启动行为</label><select><option>随应用自动启动</option><option>手动启动</option></select></div><div class="field full"><label>数据目录</label><input value="~/Library/Application Support/AutoFlow"/></div><div class="field full"><label>工作区目录</label><input value="~/Documents/AutoFlow Workspace"/></div></div><div style="display:flex;gap:9px;margin-top:20px"><button class="btn" onclick="openModal('service')">重启本地服务</button><button class="btn" onclick="showToast('已打开数据目录')">打开数据目录</button><button class="btn" onclick="showToast('诊断包已生成')">导出诊断</button></div></div>`}
function openModal(type){const data={profile:['新建浏览器配置','填写配置名称、启动地址和环境参数。',`<div class="form-grid"><div class="field full"><label>配置名称</label><input placeholder="例如：工作账号"/></div><div class="field full"><label>启动地址</label><input placeholder="https://example.com"/></div><div class="field"><label>语言</label><select><option>zh-CN</option><option>en-US</option></select></div><div class="field"><label>时区</label><select><option>Asia/Shanghai</option><option>America/Los_Angeles</option></select></div></div>`],proxy:['添加代理','认证信息保存后只显示脱敏结果。',`<div class="form-grid"><div class="field"><label>协议</label><select><option>HTTPS</option><option>SOCKS5</option></select></div><div class="field"><label>端口</label><input placeholder="8080"/></div><div class="field full"><label>主机</label><input placeholder="proxy.example.com"/></div><div class="field"><label>用户名</label><input/></div><div class="field"><label>密码</label><input type="password"/></div></div>`],provider:['添加模型供应商','密钥只写不读，读取时仅展示是否已配置。',`<div class="form-grid"><div class="field"><label>名称</label><input placeholder="OpenAI"/></div><div class="field"><label>类型</label><select><option>OpenAI compatible</option><option>Anthropic</option></select></div><div class="field full"><label>Base URL</label><input placeholder="https://api.example.com/v1"/></div><div class="field full"><label>API Key</label><input type="password" placeholder="输入新密钥"/></div></div>`],import:['批量导入','每行一个代理，错误行会单独列出，不会静默失败。',`<textarea style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:11px" placeholder="https://user:pass@host:8080"></textarea>`],delete:['删除浏览器配置','删除后无法恢复，关联的代理和内核不会受影响。','<div style="padding:14px;background:var(--clay-soft);border-radius:9px;color:var(--clay)">请确认你要删除「工作账号」。</div>'],test:['测试代理','正在连接目标地址并测量延迟。','<div class="progress"><i style="width:42%"></i></div><p>连接中… 42%</p>'],pool:['代理池','配置成员顺序和选择策略。',`<div class="field"><label>选择策略</label><select><option>按顺序轮换</option><option>随机</option><option>最低延迟优先</option></select></div><p class="sub" style="margin-top:14px">已选择 12 个代理</p>`],service:['本地服务','重启会短暂中断正在进行的请求。',`<div class="status"><i class="dot"></i>当前运行中 · 127.0.0.1:8765</div>`]}[type]||['提示','此流程尚未定义。',''];const danger=type==='delete';document.getElementById('modal').innerHTML=`<h3>${data[0]}</h3><p>${data[1]}</p>${data[2]}<div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn ${danger?'danger':'primary'}" onclick="confirmModal('${type}')">${danger?'删除':type==='test'?'开始测试':'保存'}</button></div>`;document.getElementById('backdrop').classList.add('open')}
function confirmModal(type){closeModal();showToast(type==='delete'?'配置已删除':type==='test'?'测试完成 · 延迟 82ms':'操作已完成')}
function closeModal(){document.getElementById('backdrop').classList.remove('open')};function backdropClick(e){if(e.target.id==='backdrop')closeModal()};function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.remove('show'),2600)};function filterList(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.list button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'block':'none')};init();
</script></body></html>
