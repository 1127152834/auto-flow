name: autoflow-redroid-demo
services:
  manager:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      REDROID_STATIC_DIR: /app/static
      REDROID_UPLOAD_DIR: /data/apks
      REDROID_HOST_PROC: /host/proc
      REDROID_HOST_DEV: /host/dev
      REDROID_BIND_HOST: 0.0.0.0
      REDROID_IMAGES: ${REDROID_IMAGES:-redroid/redroid:13.0.0-latest,autoflow/redroid:13-magisk}
      PORT: "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /dev:/host/dev:ro
      - uploads:/data/apks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/environment', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 15s
volumes:
  uploads:
