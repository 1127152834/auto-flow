# Dedicated Apple Silicon test VM; no host home-directory mounts.
# Image/digest: Ubuntu release-20260705 and Lima's ubuntu-24.04 template.
vmType: vz
arch: aarch64
cpus: 6
memory: 8GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y docker.io docker-compose-v2 python3-venv git adb "linux-modules-extra-$(uname -r)"
      systemctl enable --now docker
      printf 'binder_linux\n' > /etc/modules-load.d/redroid.conf
      printf 'options binder_linux devices=binder,hwbinder,vndbinder\n' > /etc/modprobe.d/redroid.conf
      modprobe binder_linux devices=binder,hwbinder,vndbinder
portForwards:
  - guestPort: 8080
    hostPort: 8081
