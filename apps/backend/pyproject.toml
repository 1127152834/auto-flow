[project]
name = "autoflow-backend"
version = "0.1.0"
description = "AutoFlow backend service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-setuptools",
]
build = [
  "pyinstaller",
]
