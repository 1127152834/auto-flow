[project]
name = "autoflow-backend"
version = "0.1.0"
description = "AutoFlow backend service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "cloakbrowser[geoip]==0.5.9",
  "httpx[socks]>=0.28,<1",
  "keyring>=25,<26",
  "tzdata>=2026.3",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "regex==2026.9.10",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "beautifulsoup4>=4.12,<5",
  "html2text>=2024.2.26,<2027",
  "ddddocr>=1.0.6,<2",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<6",
  "easyocr>=1.7,<2",
  "face-recognition>=1.3,<2",
  "setuptools>=70,<81",
  "pypdf>=4,<7",
  "python-docx>=1,<2",
  "xlrd>=2,<3",
  "faster-whisper>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-setuptools",
  "types-openpyxl>=3.1.5.20260827",
  "types-defusedxml>=0.7.0.20260504",
  "types-regex>=2026.9.10.20260911",
]
build = [
  "pyinstaller",
]
