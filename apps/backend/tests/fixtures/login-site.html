<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AutoFlow 登录夹具</title>
</head>
<body>
  <h1>本地登录测试站</h1>
  <p id="status">未登录</p>
  <form id="login" method="post" action="/login">
    <label>账号 <input id="user" name="user" /></label>
    <label>密码 <input id="password" name="password" type="password" /></label>
    <button id="submit" type="submit">登录</button>
  </form>
</body>
</html>
