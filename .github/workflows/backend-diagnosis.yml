name: Backend per-file diagnosis

# Diagnostic only. Pushing a branch named diag/backend-* or diag/windows-* runs the backend suite one file
# per process with a hard budget per file, so a hang or a slow platform shows up
# as a named file in annotations instead of an unfinished job. It never runs on
# the default branch push and does not replace the normal CI regression.
on:
  push:
    branches: ['diag/backend-**', 'diag/windows-**']

  workflow_dispatch:
    inputs:
      os:
        description: Runner image
        type: choice
        default: windows-2022
        options: [windows-2022, macos-15-intel, macos-15]
      timeout:
        description: Seconds allowed per test file
        default: '900'

concurrency:
  group: backend-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  per-file:
    # diag/windows-focus-* and diag/windows-annot-* run only their own jobs below.
    if: ${{ !startsWith(github.ref_name, 'diag/windows-focus') && !startsWith(github.ref_name, 'diag/windows-annot') }}
    runs-on: ${{ inputs.os || 'windows-2022' }}
    timeout-minutes: 340
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout frozen source used by parity tests
        uses: actions/checkout@v4
        with:
          repository: pmh1314520/WebRPA
          ref: 5ccb900e8dcf1530aae66f676d87593c416c7ebb
          path: reference/WebRPA
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked --group build
      - name: Run every backend test file in its own process
        run: >-
          uv run --directory apps/backend python scripts/ci_pytest_by_file.py
          --root tests --timeout "${{ inputs.timeout || '900' }}"

  focus:
    # Pins the Windows hang to one test and records the real B6 parity failures.
    if: ${{ startsWith(github.ref_name, 'diag/windows-focus') }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout frozen source used by parity tests
        uses: actions/checkout@v4
        with:
          repository: pmh1314520/WebRPA
          ref: 5ccb900e8dcf1530aae66f676d87593c416c7ebb
          path: reference/WebRPA
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked --group build
      - name: Golden evidence verifier tests
        if: always()
        run: uv run --directory apps/backend python scripts/ci_pytest_by_file.py --root tests/golden/test_verify_results.py --timeout 300
      - name: B6 parity files, one process each
        if: always()
        run: uv run --directory apps/backend python scripts/ci_pytest_by_file.py --root tests/differential/workflows --timeout 300
      - name: Android capacity file, one process per test
        if: always()
        run: uv run --directory apps/backend python scripts/ci_pytest_by_file.py --root tests/integration/test_android_capacity_reservations.py --per-test --timeout 120

  annotated:
    # The normal regression command without --maxfail, so every failed test shows up as an annotation.
    if: ${{ startsWith(github.ref_name, 'diag/windows-annot') }}
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout frozen source used by parity tests
        uses: actions/checkout@v4
        with:
          repository: pmh1314520/WebRPA
          ref: 5ccb900e8dcf1530aae66f676d87593c416c7ebb
          path: reference/WebRPA
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked --group build
      - name: Full backend regression, all failures listed
        run: uv run --directory apps/backend pytest -q

  strict:
    # Reports what the strict type debt gate says on Windows (diag/windows-strict-*).
    if: ${{ startsWith(github.ref_name, 'diag/windows-strict') }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked --group build
      - name: Run the gate and publish its output as annotations
        shell: bash
        run: |
          uv run --directory apps/backend python scripts/check_strict_types.py > strict-out.txt 2>&1 || true
          python - <<'PY'
          text = open('strict-out.txt', encoding='utf-8', errors='replace').read()
          lines = [l for l in text.splitlines() if l.strip()]
          head = [l for l in lines if not l.startswith('NEW')][:6]
          new = [l for l in lines if l.startswith('NEW')]
          print('::notice title=strict-summary::' + ' | '.join(head)[:3000].replace('%','%25'))
          chunk, size, n = [], 0, 0
          for l in new:
              if size + len(l) > 2800 and chunk:
                  n += 1
                  print(f'::notice title=strict-new-{n}::' + '%0A'.join(chunk).replace('%0A','\n').replace('%','%25').replace('\n','%0A'))
                  chunk, size = [], 0
                  if n >= 8: break
              chunk.append(l[:600]); size += len(l)
          else:
              if chunk:
                  print('::notice title=strict-new-last::' + '%0A'.join(chunk).replace('%','%25').replace('%250A','%0A'))
          PY
