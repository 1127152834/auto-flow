name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Checkout frozen source used by parity tests
        uses: actions/checkout@v4
        with:
          repository: pmh1314520/WebRPA
          ref: 5ccb900e8dcf1530aae66f676d87593c416c7ebb
          path: reference/WebRPA
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:scripts
      - run: npm run lint
      - run: npm run openapi:check
      - run: uv run --directory apps/backend ruff check .
      - run: uv run --directory apps/backend mypy src
      - name: Check native Windows platform boundaries
        timeout-minutes: 10
        if: runner.os == 'Windows'
        run: uv run --directory apps/backend pytest -vv --tb=short --maxfail=10 tests/unit/test_browser_processes.py tests/integration/test_workflow_worker_protocol.py tests/integration/test_b1_stop_and_browser_crash_regressions.py tests/integration/test_workflow_recovery.py tests/unit/test_new_file.py tests/unit/test_project_excel_publication.py tests/integration/test_workflow_artifacts.py tests/integration/test_project_excel_exports.py tests/integration/test_project_crash_recovery.py tests/integration/test_workflow_worker_process.py tests/integration/test_kernel_worker.py tests/differential/workflows/test_b1_executor_parity.py tests/unit/test_android_runtime.py tests/unit/test_environment_browser.py tests/unit/workflows/test_browser_session_contract.py tests/contract/test_project_data_records.py
      - name: Check native desktop path and settings contracts
        if: runner.os == 'Windows'
        run: npm --workspace @autoflow/desktop test -- src/main/platform/paths.test.ts src/main/sidecar/supervisor.test.ts src/main/settings/settings.integration.test.ts src/renderer/domains/project-automations/pages/AutomationDetailPage.test.tsx
      - name: Check project HTTP writes before full regression
        run: node scripts/smoke-project-management.mjs --output-dir artifacts/pm9/http-preflight
      - run: uv run --directory apps/backend pytest -q --maxfail=20
      - run: npm test
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Install pinned real browser for PM9 runtime acceptance
        shell: bash
        run: |
          uv run --directory apps/backend python - <<'PYTHON'
          import os, sys
          from cloakbrowser import ensure_binary
          executable = ensure_binary(browser_version='146.0.7680.177.5' if sys.platform == 'win32' else '145.0.7632.109.2')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PM9_BROWSER_EXECUTABLE={executable}\n')
          PYTHON
      - name: Verify real worker delivery loss and manual expiry race
        run: uv run --directory apps/backend pytest -q tests/integration/test_project_batch_real_cloakbrowser.py -k "parallel or manual-declared or data-subflow or data-response-loss or data-link-race or data-old-candidate or manual-race or manual-expire"
        env:
          AUTOFLOW_TEST_CLOAKBROWSER: ${{ env.PM9_BROWSER_EXECUTABLE }}
      - run: node scripts/smoke-project-management.mjs --runtime-kernel "${{ env.PM9_BROWSER_EXECUTABLE }}" --output-dir artifacts/pm9/source
      - run: node scripts/smoke-project-management-desktop.mjs --output-dir artifacts/pm9/source
      - run: npm run backend:build
      - run: npm run package:dir
      - name: Check and smoke packaged sidecar
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat } from 'node:fs/promises'
          import { dirname, join, relative, resolve } from 'node:path'
          import { spawnSync } from 'node:child_process'

          const root = resolve('apps/desktop/dist')
          const expected = process.platform === 'win32' ? 'autoflow-backend.exe' : 'autoflow-backend'
          async function find(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) {
                const found = await find(path)
                if (found) return found
              } else if (entry.name === expected && relative(root, path).split(/[\\\\/]/).includes('backend')) {
                return path
              }
            }
          }
          const executable = await find(root)
          if (!executable || !(await stat(executable)).isFile()) throw new Error('packaged sidecar executable not found')
          console.log(`smoking ${executable}`)
          const result = spawnSync(process.execPath, ['scripts/smoke-sidecar.mjs', '--executable', executable], { stdio: 'inherit' })
          if (result.status !== 0) process.exit(result.status ?? 1)
          const project = spawnSync(process.execPath, ['scripts/smoke-project-management.mjs', '--executable', executable, '--runtime-kernel', process.env.PM9_BROWSER_EXECUTABLE, '--output-dir', 'artifacts/pm9/packaged'], { stdio: 'inherit' })
          if (project.status !== 0) process.exit(project.status ?? 1)
          const combinations = spawnSync(process.execPath, ['scripts/smoke-project-business-combinations.mjs', '--executable', executable, '--runtime-kernel', process.env.PM9_BROWSER_EXECUTABLE, '--output-dir', 'artifacts/pm9/packaged'], { stdio: 'inherit' })
          if (combinations.status !== 0) process.exit(combinations.status ?? 1)
          const projectDesktopExecutable = resolve(dirname(executable), process.platform === 'win32' ? '../../AutoFlow.exe' : '../../MacOS/AutoFlow')
          const projectDesktop = spawnSync(process.execPath, ['scripts/smoke-project-management-desktop.mjs', '--executable', projectDesktopExecutable, '--runtime-kernel', process.env.PM9_BROWSER_EXECUTABLE, '--output-dir', 'artifacts/pm9/packaged'], { stdio: 'inherit' })
          if (projectDesktop.status !== 0) process.exit(projectDesktop.status ?? 1)
          const browser = spawnSync(process.execPath, ['scripts/smoke-browser-management.mjs', '--executable', executable], { stdio: 'inherit' })
          if (browser.status !== 0) process.exit(browser.status ?? 1)
          const desktop = resolve(dirname(executable), process.platform === 'win32' ? '../../AutoFlow.exe' : '../../MacOS/AutoFlow')
          const desktopResult = spawnSync(process.execPath, ['scripts/smoke-desktop.mjs', '--executable', desktop], { stdio: 'inherit' })
          if (desktopResult.status !== 0) process.exit(desktopResult.status ?? 1)
          const browserDesktop = spawnSync(process.execPath, ['scripts/smoke-browser-management-desktop.mjs', '--executable', desktop], { stdio: 'inherit' })
          process.exitCode = browserDesktop.status ?? 1
          NODE
      - name: Build installer artifact
        shell: bash
        run: |
          cd apps/desktop
          npx electron-builder --config electron-builder.yml
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const root = resolve('dist')
          const expected = process.platform === 'win32' ? /\.exe$/ : /\.dmg$/
          const artifacts = (await readdir(root)).filter(name => expected.test(name))
          if (!artifacts.length) throw new Error(`installer artifact not found in ${root}`)
          console.log(`installer artifacts: ${artifacts.join(', ')}`)
          NODE
      - run: npm run smoke:desktop
      - run: node scripts/smoke-browser-management-desktop.mjs
      - run: node scripts/smoke-browser-management.mjs
      - name: Upload PM9 reports and installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm9-${{ matrix.os }}
          path: |
            artifacts/pm9/**
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          if-no-files-found: warn
