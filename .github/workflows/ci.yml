name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/backend --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke:desktop
      - run: npm run backend:build
      - run: npm run package:dir
      - name: Check and smoke packaged sidecar
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat } from 'node:fs/promises'
          import { dirname, join, relative, resolve } from 'node:path'
          import { spawnSync } from 'node:child_process'

          const root = resolve('apps/desktop/dist')
          const expected = process.platform === 'win32' ? 'autoflow-backend.exe' : 'autoflow-backend'
          async function find(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) {
                const found = await find(path)
                if (found) return found
              } else if (entry.name === expected && relative(root, path).split(/[\\\\/]/).includes('backend')) {
                return path
              }
            }
          }
          const executable = await find(root)
          if (!executable || !(await stat(executable)).isFile()) throw new Error('packaged sidecar executable not found')
          console.log(`smoking ${executable}`)
          const result = spawnSync(process.execPath, ['scripts/smoke-sidecar.mjs', '--executable', executable], { stdio: 'inherit' })
          if (result.status !== 0) process.exit(result.status ?? 1)
          const desktop = resolve(dirname(executable), process.platform === 'win32' ? '../../AutoFlow.exe' : '../../MacOS/AutoFlow')
          const desktopResult = spawnSync(process.execPath, ['scripts/smoke-desktop.mjs', '--executable', desktop], { stdio: 'inherit' })
          process.exitCode = desktopResult.status ?? 1
          NODE
      - name: Build installer artifact
        shell: bash
        run: |
          cd apps/desktop
          npx electron-builder --config electron-builder.yml
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const root = resolve('dist')
          const expected = process.platform === 'win32' ? /\.exe$/ : /\.dmg$/
          const artifacts = (await readdir(root)).filter(name => expected.test(name))
          if (!artifacts.length) throw new Error(`installer artifact not found in ${root}`)
          console.log(`installer artifacts: ${artifacts.join(', ')}`)
          NODE
      - run: npm run openapi:check
      - run: uv run --directory apps/backend ruff check .
      - run: uv run --directory apps/backend mypy src
      - run: uv run --directory apps/backend pytest -q
